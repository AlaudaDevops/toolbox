# Example configuration file for Roadmap Planner
# Copy this file to config.yaml and update with your values

# Debug mode - set to true for development
debug: false

# Jira configuration
jira:
  base_url: "https://your-jira-instance.atlassian.net"
  username: "your-username"
  password: "your-api-token"  # Use API token for better security
  project: "DEVOPS"

  # Team-analytics Jira ingestion. Independent of metrics.enabled —
  # this drives the issue_snapshots table and the Team dashboard.
  # Requires storage.enabled = true.
  sync_enabled: false
  sync_interval: "30m"
  backfill_days: 0             # 0 = inherit storage.backfill_days
  story_points_field: ""       # e.g. "customfield_10016" — leave empty to skip
  sprint_field: ""             # e.g. "customfield_10020" — leave empty to skip

# Server configuration
server:
  port: 8080
  cors:
    allowed_origins:
      - "http://localhost:3000"
      - "https://your-frontend-domain.com"

logger:
  level: "info"           # debug, info, warn, error
  development: false      # enables colored console output
  encoding: "json"        # json or console

# Cache configuration
cache:
  ttl: "5m"              # Time to live for cached data
  refresh_interval: "1m"  # How often to refresh cache

# Metrics configuration
metrics:
  enabled: true
  collection_interval: "5m"      # How often to fetch from Jira
  historical_days: 365           # How far back to query

  prometheus:
    enabled: true
    path: "/metrics"
    namespace: "roadmap"         # Metric prefix: roadmap_dora_*

  filters:
    - name: "releases"
      enabled: true
      options:
        name_regex: '^[a-zA-Z0-9\-]+\-[v]*\d+.\d+.\d+$'

    - name: "issues"
      enabled: true
      options:
        issuetypes: ["Bug"]

  calculators:
    - name: "release_frequency"
      enabled: true
      options:
        window_months: 4         # Rolling window for calculation

    - name: "lead_time_to_release"
      enabled: true
      options:
        percentile: 50           # Use median (P50)

    - name: "cycle_time"
      enabled: true
      options:
        in_progress_statuses: ["In Progress", "In Development", "调研中", "调研完成", "设计完成", "开发完成", "测试完成", "验收完成"]
        done_statuses: ["Done", "Closed", "Released", "已完成"]
        component_pattern: '^[a-zA-Z0-9\-]+\-[v]*\d+.\d+.\d+$'

    - name: "patch_ratio"
      enabled: true
      options:
        patch_pattern: "^(.+)-[v]*(\\d+\\.\\d+\\.\\d+)$"  # component-X.Y.Z

    - name: "time_to_patch"
      enabled: true
      options:
        bug_types: ["Bug", "Vulnerability", "Security"]

# Team analytics — durable store for historical Jira + GitHub data.
# See docs/team-analytics/PROPOSAL.md for the full design.
storage:
  enabled: false               # set true to enable team analytics
  type: "sqlite"               # "sqlite" (file-based) or "postgres"
  path: "./data/roadmap.db"    # for type=sqlite
  dsn: ""                      # for type=postgres, e.g. "postgres://user:pass@host:5432/roadmap?sslmode=disable"
  backfill_days: 180           # first-run window: how far back to fetch on initial cycle

# GitHub ingestion — pulls PRs and reviews into the storage tier.
# Requires storage.enabled = true.
github:
  enabled: false
  base_url: ""                 # empty -> api.github.com; set for GHES
  sync_interval: "30m"
  project_key: ""              # for the default Linker; defaults to jira.project
  backfill_days: 0             # 0 = inherit storage.backfill_days
  repos:
    - "AlaudaDevops/toolbox"
    # - "owner/name:component"  # optional component label per repo
    # - "AlaudaDevops/*"        # wildcard: expand to every active,
    #                           # non-fork repo in the org. Resolved
    #                           # at sync time, cached 24h. Works
    #                           # alongside explicit entries — an
    #                           # explicit OWNER/NAME:component still
    #                           # keeps its component label.

  # Auth — App is recommended for production. Token is fine for local
  # dev or one-off scripts. App wins when both are set.
  token: ""                    # PAT path (or set GITHUB_TOKEN env var)
  app:
    app_id: 0                  # numeric, from the App settings page
    installation_id: 0         # numeric, from the org's "installed apps" page
    # Provide ONE of:
    private_key_path: ""       # path to the PEM file (mount via Secret)
    private_key_pem: ""        # raw PEM contents (use env GITHUB_APP_PRIVATE_KEY_PEM in K8s)